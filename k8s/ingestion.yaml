apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
      - name: ingestion
        image: project-ingestion:latest
        imagePullPolicy: Never
        env:
        - name: KAFKA_SERVER
          value: "kafka:9092"